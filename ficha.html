<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ficha — Feiticeiros &amp; Maldições</title>
    <link rel="stylesheet" type="text/css" href="css/quickref.css">
    <link rel="stylesheet" type="text/css" href="css/icons.css">
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans:400,400i,700,700i&display=swap" rel="stylesheet"
        type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Lora:700&display=swap" rel="stylesheet" type="text/css">
    <link rel="icon" type="image/png" href="img/crowned-skull.png">
</head>

<body class="page-background body-ficha">

    <nav id="nav">
        <div class="nav-inner">
            <span class="nav-brand">F&amp;M 2.5.2</span>
            <div class="nav-tabs">
                <a href="index.html">Combate</a>
                <a href="habilidades.html">Habilidades</a>
                <a href="evolucao.html">Evolução</a>
                <a href="ficha.html" class="active">Ficha</a>
            </div>
            <div class="espaco"></div>
            <button type="button" class="btn-topo" id="btn-contas">Contas resumidas</button>
            <button type="button" class="btn-topo" id="btn-exportar">Exportar</button>
            <button type="button" class="btn-topo" id="btn-importar">Importar</button>
            <button type="button" class="btn-topo perigo" id="btn-nova">Nova</button>
            <button type="button" id="btn-tema" aria-pressed="false"
                title="Alternar modo dia/noite">☾ <span>Noite</span></button>
        </div>
    </nav>

    <div class="ficha-app" id="ficha">

        <!-- coluna 1: identidade, atributos, recursos, valores, aptidões -->
        <div class="col col-1">
            <div class="painel hidden" id="caixa-json">
                <textarea id="area-json" rows="5" spellcheck="false"
                    placeholder="O JSON aparece aqui ao exportar. Para importar, cole um JSON e clique em Importar."></textarea>
            </div>
            <div class="cartao" id="sec-identidade">
                <div id="ficha-identidade"></div>
            </div>
            <div class="cartao" id="sec-atributos">
                <h2>Atributos</h2>
                <div class="selo">
                    <!-- selo de barreira: seis vértices, um por atributo -->
                    <svg class="selo-arte" viewBox="0 0 300 300" aria-hidden="true">
                        <defs>
                            <radialGradient id="brilhoSelo" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="var(--selo-brilho)" stop-opacity=".5" />
                                <stop offset="70%" stop-color="var(--selo-brilho)" stop-opacity="0" />
                            </radialGradient>
                        </defs>
                        <circle cx="150" cy="150" r="120" fill="url(#brilhoSelo)" />
                        <circle class="selo-veu" cx="150" cy="150" r="142" />
                        <circle class="selo-veu-fino" cx="150" cy="150" r="134" />
                        <polygon class="selo-hex" points="150,45 240.9,97.5 240.9,202.5 150,255 59.1,202.5 59.1,97.5" />
                        <polygon class="selo-hex-int" points="150,88 187.2,109.5 187.2,152.5 150,174 112.8,152.5 112.8,109.5" />
                        <g class="selo-raios">
                            <line x1="150" y1="150" x2="150" y2="45" />
                            <line x1="150" y1="150" x2="240.9" y2="97.5" />
                            <line x1="150" y1="150" x2="240.9" y2="202.5" />
                            <line x1="150" y1="150" x2="150" y2="255" />
                            <line x1="150" y1="150" x2="59.1" y2="202.5" />
                            <line x1="150" y1="150" x2="59.1" y2="97.5" />
                        </g>
                        <circle class="selo-nucleo" cx="150" cy="150" r="30" />
                    </svg>
                    <div class="selo-nos" id="ficha-atributos"></div>
                    <div class="selo-centro" id="ficha-selo-centro"></div>
                </div>
            </div>
            <div class="cartao" id="sec-recursos">
                <div id="ficha-recursos"></div>
            </div>
            <div class="cartao" id="sec-valores">
                <div class="tiles" id="ficha-valores"></div>
            </div>
            <div class="cartao" id="sec-aptidoes">
                <h2>Aptidões <span class="h2-nota">0 a 5</span></h2>
                <div class="grade-apt" id="ficha-aptidoes"></div>
            </div>
        </div>

        <!-- coluna 2: perícias -->
        <div class="col col-2">
            <div class="cartao alto" id="sec-pericias">
                <h2>Perícias <span class="h2-nota">T · M · outros</span></h2>
                <div class="linhas" id="ficha-pericias"></div>
                <p class="rodape-col">* em regra, só pode ser usada se você for treinado</p>
            </div>
        </div>

        <!-- coluna 3: abas -->
        <div class="col col-3">
            <div class="cartao alto" id="sec-abas">
                <div class="abas" id="abas-ficha">
                    <button type="button" class="aba-btn ativa" data-aba="habilidades">Habilidades</button>
                    <button type="button" class="aba-btn" data-aba="testes">Ataques e TRs</button>
                    <button type="button" class="aba-btn" data-aba="assistente">Assistente</button>
                    <button type="button" class="aba-btn" data-aba="notas">Anotações</button>
                </div>

                <div class="aba-painel" data-painel="habilidades">
                    <div id="ficha-itens"></div>
                </div>

                <div class="aba-painel hidden" data-painel="testes">
                    <h2>Jogadas de Ataque</h2>
                    <div class="linhas" id="ficha-ataques"></div>
                    <h2>Testes de Resistência</h2>
                    <div class="linhas" id="ficha-resistencias"></div>
                </div>

                <div class="aba-painel hidden" data-painel="assistente">
                    <div class="aviso-ficha hidden" id="aviso-ficha"></div>
                    <div id="ficha-assistente"></div>
                </div>

                <div class="aba-painel hidden" data-painel="notas">
                    <textarea data-campo="anotacoes" class="anotacoes" rows="18"
                        placeholder="Equipamento, feitiços, votos, ganchos de história…"></textarea>
                </div>
            </div>
        </div>

    </div>

    <script type="text/javascript" src="js/data_hab_base.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/data_hab_lutador.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/data_hab_combate.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/data_hab_tecnica.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/data_hab_controlador.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/data_hab_suporte.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/data_hab_restringido.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/data_hab_talento.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/data_hab_aptidao.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/data_evolucao.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/data_ficha.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/engine.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/ficha.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/ficha_cris.js" charset="utf-8"></script>
    <script type="text/javascript" src="js/ficha_ui.js" charset="utf-8"></script>
</body>

</html>
